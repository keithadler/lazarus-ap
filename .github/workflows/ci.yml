name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Emulator test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets
      - run: cargo test

  parity:
    name: Byte parity with the reference emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Each fixture's output must match the golden captured from a
      # locally-built yaGPC2, byte for byte.
      - name: HAL/S programs
        run: |
          set -e
          diff <(cargo run -q --bin lazap -- roms/hello/hello.fcm) roms/hello/golden.txt
          diff <(cargo run -q --bin lazap -- roms/p176/176-P.fcm --steps 3000000) roms/p176/golden.txt
          echo "42, 3.14" | diff <(cargo run -q --bin lazap -- roms/read_write/read_write.fcm) roms/read_write/golden.txt
          diff <(cargo run -q --bin lazap -- roms/read_eof/read_eof_onerror.fcm < /dev/null) roms/read_eof/golden.txt
      - name: Our own compiled HAL/S program still runs
        run: cargo run -q --bin lazap -- roms/lazarus/LAZARUS.fcm | grep -q "LAZARUS AP LIVES"
      # A linked image must not carry another program's symbol table
      # (see roms/nasa/DEFECTS.md, LAZARUS-2).
      - name: Symbol tables match their object decks
        run: python3 tools/check_symtabs.py

  flight-math:
    name: NASA flight routines still compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The linked images are committed, so the flight mathematics is
      # verifiable without rebuilding the historical toolchain.
      - name: Build
        run: cargo build --release --bins
      # Every routine in roms/nasa/lab.json is run and checked against
      # modern mathematics; lab.md is regenerated from the result.
      - name: Every resurrected routine still computes
        run: python3 tools/labcheck.py
      - name: lab.md is in sync with the checker
        run: git diff --exit-code roms/nasa/lab.md
      # The timing model must keep producing a finite budget for a real
      # program (guards against a table or decode regression).
      - name: Execution-time model runs
        run: |
          set -e
          cargo run -q --release --bin lazap-time -- roms/hello/hello.fcm | tee /tmp/t.txt
          grep -qE 'execution time [0-9]+\.[0-9]+ time units' /tmp/t.txt
      # The README's terminal cards are generated from real output; they
      # must not drift from what the binaries actually print.
      - name: README images are current
        run: python3 tools/mkshots.py --check

  pages:
    name: The resource page is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages serves docs/index.html directly; it must have no
      # external requests and no stray entity text.
      - run: |
          set -e
          test -f docs/index.html
          python3 tools/mkpage.py --check
          # No external *resource* loads. rel=canonical and the Open Graph
          # image URL are metadata, not fetches, so they are excluded.
          ! grep -E '<(script|img)[^>]+src="https?:' docs/index.html
          ! grep -E '<link[^>]+href="https?:' docs/index.html | grep -qv 'rel="canonical"'
          ! grep -qE '&(mdash|rsquo|middot);' <(grep -oE "textContent = [^;]+" docs/index.html || true)
          echo "docs/index.html: self-contained, $(wc -c < docs/index.html) bytes"

  wasm:
    name: The emulator builds for the browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --release
      - name: Exports the browser console needs
        run: |
          set -e
          for f in boot step state output peek set_new set_step set_state buf_reserve; do
            grep -q "$f" target/wasm32-unknown-unknown/release/lazarus_ap.wasm || exit 1
          done
          echo "wasm: $(wc -c < target/wasm32-unknown-unknown/release/lazarus_ap.wasm) bytes, all exports present"
